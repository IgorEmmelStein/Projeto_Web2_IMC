<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/index.css">
    <title>Visualização de Dados</title>
</head>

<body onload="carregarDados('todos')">
    <div class="container">
        <img src="" alt="banner"> <br>
        <label>Todos os dados em tabela</label>
        <br><br>

        <div id="tabela-resultados">
        </div>

        <br>
        <button type="button" onclick="location.href='PainelAdministrativo.html'">Voltar ao Painel</button>
    </div>

    <script>
        function carregarDados(filtro) {
            fetch('../php/dadosConexao.php?acao=' + filtro)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('tabela-conteudo').innerHTML = data;
                    document.getElementById('titulo-pagina').innerText = "Relatório: " + filtro.toUpperCase();
                })
                .catch(error => console.error('Erro:', error));
        }
    </script>
</body>

</html>
